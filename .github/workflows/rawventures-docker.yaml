name: Rawventures - build and publish Docker image

# Fork-only workflow.
#
# The filename is deliberately ours: upstream owns `docker.yaml` (renamed from
# `docker-build.yaml` in v0.9.x), so rebasing our customizations onto a new
# release must never conflict in .github/.
#
# Upstream's workflow files stay in the tree but are disabled through the API —
# see scripts/fork/sync-workflow-state.sh. That matters because upstream's
# docker.yaml triggers on `push: tags: [v*]`, which matches our release tags.
#
# Publishes to DigitalOcean Container Registry. Requires the repository secret
# DIGITALOCEAN_ACCESS_TOKEN — a DO API token with read/write registry access.
# DOCR takes the token as both the username and the password.
#
# Manual dispatch only. Dispatch from the release tag (v<version>-custom) so the
# published image carries the version, not just the branch name.

on:
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com
  FULL_IMAGE_NAME: registry.digitalocean.com/venture-studio-main/open-webui

jobs:
  build-main-image:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Extract metadata for Docker images
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=git-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # No :latest. Images are pulled by version tag (v0.10.2-custom); a
          # floating :latest on a fork we rebase is a footgun, and DOCR quota is
          # tight enough that we don't want a second copy of every build.
          flavor: |
            latest=false

      - name: Build Docker image
        uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.FULL_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # GitHub Actions cache, not a registry cache: DOCR quota is small and a
          # registry cache with mode=max would fill it with cache-* tags.
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max
          build-args: |
            BUILD_HASH=${{ github.sha }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-main-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-main-images:
    runs-on: ubuntu-latest
    needs: [build-main-image]
    permissions:
      contents: read
    steps:
      - name: Download digests
        uses: actions/download-artifact@v5
        with:
          pattern: digests-main-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Extract metadata for Docker images
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=git-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # No :latest. Images are pulled by version tag (v0.10.2-custom); a
          # floating :latest on a fork we rebase is a footgun, and DOCR quota is
          # tight enough that we don't want a second copy of every build.
          flavor: |
            latest=false

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.FULL_IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.FULL_IMAGE_NAME }}:${{ steps.meta.outputs.version }}
